<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Artist Building 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0C;
    --black-2: #131317;
    --white: #FFFFFF;
    --off-white: rgba(255,255,255,0.72);
    --off-white-dim: rgba(255,255,255,0.42);
    --blue: #3D5CFF;
    --blue-bright: #6C86FF;
    --blue-dim: rgba(61, 92, 255, 0.18);
    --line: rgba(255,255,255,0.16);
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 900px 600px at 50% 15%, var(--blue-dim), transparent 60%),
      var(--black);
    color: var(--white);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(32px, calc(16px + var(--sat))) max(16px, var(--sar)) max(32px, calc(16px + var(--sab))) max(16px, var(--sal));
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }

  .stage-label {
    position: fixed;
    top: max(24px, calc(12px + var(--sat)));
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--blue-bright);
    opacity: 0.8;
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
  }

  .ticket-wrap {
    position: relative;
    width: 100%;
    max-width: 620px;
    z-index: 2;
    margin: auto 0;
    transition: max-width 0.7s cubic-bezier(.22,.61,.36,1);
    will-change: max-width;
  }

  .ticket-wrap.expanded {
    max-width: 720px;
  }

  .ticket {
    display: grid;
    grid-template-columns: 100px 1fr;
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.8);
    position: relative;
    transition: transform 0.9s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
    min-height: 380px;
  }

  .stub {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0;
    border-right: 2px dashed var(--line);
    user-select: none;
    -webkit-user-select: none;
    will-change: transform, opacity;
  }

  .stub::before, .stub::after {
    content: '';
    position: absolute;
    left: -11px;
    width: 22px;
    height: 22px;
    background: var(--black);
    border-radius: 50%;
  }
  .stub::before { top: -11px; }
  .stub::after { bottom: -11px; }

  .stub-vertical {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--blue-bright);
    white-space: nowrap;
  }

  .stub-code {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--white);
    opacity: 0.4;
    writing-mode: vertical-rl;
    white-space: nowrap;
  }

  .main-panel {
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    will-change: transform, opacity;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--blue-bright);
    margin-bottom: 14px;
  }

  .headline {
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 5.6vw, 48px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--white);
    margin-bottom: 18px;
    word-break: break-word;
  }

  .sub {
    font-size: 16px;
    line-height: 1.6;
    color: var(--off-white);
    max-width: 40ch;
    margin-bottom: 30px;
    font-weight: 400;
  }

  .details-row {
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--off-white-dim);
  }

  .details-row div {
    min-width: 0;
  }

  .details-row div span {
    display: block;
    color: var(--white);
    font-size: 13px;
    margin-top: 4px;
    letter-spacing: 0.02em;
    text-transform: none;
    font-weight: 500;
    word-break: break-word;
  }

  .redeem-btn {
    position: relative;
    background: var(--blue);
    color: var(--white);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 16px 30px;
    min-height: 48px;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    align-self: flex-start;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  @media (hover: hover) {
    .redeem-btn:hover {
      background: var(--blue-bright);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -8px rgba(61,92,255,0.55);
    }
  }

  .redeem-btn:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 3px;
  }

  .redeem-btn:active {
    background: var(--blue-bright);
    transform: translateY(0);
    box-shadow: 0 4px 12px -4px rgba(61,92,255,0.4);
  }

  /* torn halves */
  .ticket.torn .stub {
    animation: tearLeft 0.9s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .ticket.torn .main-panel {
    animation: tearRight 0.9s cubic-bezier(.22,.61,.36,1) forwards;
  }

  @keyframes tearLeft {
    to { transform: translate(-70px, 46px) rotate(-9deg); opacity: 0; }
  }
  @keyframes tearRight {
    to { transform: translate(70px, -24px) rotate(4deg); opacity: 0; }
  }

  .ticket.torn { pointer-events: none; }

  /* reveal panel */
  .reveal {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(20px, 4vh, 44px) clamp(16px, 4vw, 28px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease 0.5s;
    overflow: hidden;
    border-radius: 6px;
    will-change: opacity;
  }

  .reveal.show {
    opacity: 1;
    pointer-events: auto;
  }

  .reveal-ring {
    position: absolute;
    inset: -1px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--black-2);
    z-index: -1;
  }

  .reveal-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 2.5vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--blue-bright);
    margin-bottom: clamp(12px, 3vh, 22px);
  }

  .amount {
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 12vw, 104px);
    color: var(--white);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  .amount-currency {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 3vw, 16px);
    letter-spacing: 0.25em;
    color: var(--blue-bright);
    text-transform: uppercase;
    margin-bottom: clamp(18px, 4vh, 36px);
  }

  .note {
    max-width: 48ch;
    font-size: clamp(14px, 3.5vw, 17px);
    line-height: 1.65;
    color: var(--off-white);
    margin-bottom: clamp(18px, 4vh, 30px);
  }

  .signoff {
    font-family: 'Raleway', sans-serif;
    font-weight: 600;
    font-size: clamp(13px, 3vw, 15px);
    color: var(--white);
  }

  /* decorative burst behind amount */
  .burst {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(460px, 90%);
    height: min(460px, 90%);
    transform: translate(-50%, -55%) scale(0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease 0.5s, transform 1.1s cubic-bezier(.22,.61,.36,1) 0.5s;
    z-index: -1;
    will-change: transform, opacity;
  }
  .reveal.show .burst {
    opacity: 1;
    transform: translate(-50%, -55%) scale(1);
  }
  .burst circle {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
  }
  .burst .accent {
    stroke: var(--blue);
    opacity: 0.5;
  }

  /* confetti */
  .confetti {
    position: fixed;
    top: -20px;
    width: 8px;
    height: 14px;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    will-change: transform, opacity;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }

  @media (max-width: 580px) {
    .ticket { grid-template-columns: 64px 1fr; }
    .main-panel { padding: 32px 22px; }
    .details-row { flex-wrap: wrap; gap: 18px; }
    .redeem-btn { width: 100%; text-align: center; }
  }

  @media (max-width: 380px) {
    .ticket { grid-template-columns: 52px 1fr; }
    .stub { padding: 20px 0; }
    .main-panel { padding: 24px 16px; }
    .details-row { gap: 12px; }
    .redeem-btn { padding: 14px 20px; font-size: 12px; }
  }

  @media (max-height: 620px) {
    .stage-label {
      position: relative;
      top: 0;
      left: 0;
      transform: none;
      margin-bottom: 16px;
      text-align: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticket-wrap, .ticket, .reveal, .burst, .redeem-btn {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    .ticket.torn .stub, .ticket.torn .main-panel {
      animation: none !important;
      opacity: 0 !important;
    }
  }
</style>
</head>
<body>

<div class="stage-label" id="stageLabel">Artist Building &middot; 2026</div>

<div class="ticket-wrap" id="ticketWrap">
  <div class="ticket" id="ticket" role="region" aria-label="Birthday Ticket">
    <div class="stub">
      <div class="stub-vertical" id="stubLabel">Sponsor</div>
      <div class="stub-code" id="stubCode">No. 001</div>
    </div>
    <div class="main-panel">
      <div class="eyebrow" id="eyebrow">Official &ldquo;Fan&rdquo; Partner</div>
      <h1 class="headline" id="headline">Happy Birthday, Jegs</h1>
      <p class="sub" id="subcopy">This one is for my favorite artist, from your biggest fan.</p>
      <div class="details-row">
        <div>Partner<span id="partnerDisplay">TG</span></div>
        <div>Beneficiary<span id="beneficiaryDisplay">Jegs</span></div>
        <div>Term<span id="termDisplay">Til death do us part</span></div>
      </div>
      <button class="redeem-btn" id="redeemBtn" type="button" aria-controls="reveal" aria-expanded="false">Accept Sponsorship</button>
    </div>

    <div class="reveal" id="reveal" aria-live="polite">
      <div class="reveal-ring"></div>
      <svg class="burst" viewBox="0 0 460 460" aria-hidden="true" focusable="false">
        <circle cx="230" cy="230" r="140" />
        <circle class="accent" cx="230" cy="230" r="180" />
        <circle cx="230" cy="230" r="215" />
      </svg>
      <div class="reveal-eyebrow" id="revealEyebrow">Partnership Confirmed</div>
      <div class="amount" id="amountDisplay">0</div>
      <div class="amount-currency" id="currencyDisplay">LKR</div>
      <p class="note" id="noteDisplay"></p>
      <div class="signoff" id="signoffDisplay">Your partner, TG</div>
    </div>
  </div>
</div>

<script>
  // ---- CONFIG: edit before sending ----
  const CONFIG = {
    stageLabel: "Artist Building · 2026",
    stubLabel: "Sponsor",
    ticketCode: "No. 001",
    eyebrow: "Official \u201cFan\u201d Partner",
    headline: "Happy Birthday, Jegs",
    subcopy: "This one is for my favorite artist, from your biggest fan.",
    partner: "TG",
    beneficiary: "Jegs",
    term: "Til death do us part",
    buttonLabel: "Accept Sponsorship",
    revealEyebrow: "Partnership Confirmed",
    currency: "LKR",
    amount: 100000,
    note: "Use it for the studio time, the gear, the concert, or whatever gets the next song out of your head and into the world (or to Uber Eats street burgher everyday). Regardless, I\u2019m always in your corner. Have a great day!",
    signoff: "Your partner, TG"
  };
  // --------------------------------------

  document.getElementById('stageLabel').textContent = CONFIG.stageLabel;
  document.getElementById('stubLabel').textContent = CONFIG.stubLabel;
  document.getElementById('stubCode').textContent = CONFIG.ticketCode;
  document.getElementById('eyebrow').innerHTML = CONFIG.eyebrow;
  document.getElementById('headline').textContent = CONFIG.headline;
  document.getElementById('subcopy').textContent = CONFIG.subcopy;
  document.getElementById('partnerDisplay').textContent = CONFIG.partner;
  document.getElementById('beneficiaryDisplay').textContent = CONFIG.beneficiary;
  document.getElementById('termDisplay').textContent = CONFIG.term;
  document.getElementById('redeemBtn').textContent = CONFIG.buttonLabel;
  document.getElementById('revealEyebrow').textContent = CONFIG.revealEyebrow;
  document.getElementById('currencyDisplay').textContent = CONFIG.currency;
  document.getElementById('noteDisplay').textContent = CONFIG.note;
  document.getElementById('signoffDisplay').textContent = CONFIG.signoff;

  const ticket = document.getElementById('ticket');
  const ticketWrap = document.getElementById('ticketWrap');
  const reveal = document.getElementById('reveal');
  const btn = document.getElementById('redeemBtn');
  const amountEl = document.getElementById('amountDisplay');

  function countUp(target) {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      amountEl.textContent = target.toLocaleString();
      return;
    }
    const duration = 5000;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.floor(eased * target);
      amountEl.textContent = current.toLocaleString();
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function launchConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#3D5CFF', '#6C86FF', '#FFFFFF'];
    
    function createPiece() {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = (Math.random() * 95 + 2.5) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.width = (5 + Math.random() * 5) + 'px';
      piece.style.height = (10 + Math.random() * 8) + 'px';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const duration = 2800 + Math.random() * 2000;
      const delay = Math.random() * 300;
      piece.style.animation = `fall ${duration}ms ease-in ${delay}ms forwards`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), duration + delay + 200);
    }

    const initialCount = window.innerWidth < 480 ? 40 : 60;
    for (let i = 0; i < initialCount; i++) {
      createPiece();
    }

    setInterval(() => {
      const streamCount = window.innerWidth < 480 ? 2 : 3;
      for (let i = 0; i < streamCount; i++) {
        createPiece();
      }
    }, 250);
  }

  btn.addEventListener('click', () => {
    btn.setAttribute('aria-expanded', 'true');
    ticket.classList.add('torn');
    ticketWrap.classList.add('expanded');
    reveal.classList.add('show');
    setTimeout(() => {
      countUp(CONFIG.amount);
      launchConfetti();
    }, 500);
  });
</script>

</body>
</html>
